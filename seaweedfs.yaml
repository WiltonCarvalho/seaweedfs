apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-s3-config
  namespace: default
data:
  s3.json: |
    {
      "identities": [
        {
          "name": "root",
          "credentials": [
            {
              "accessKey": "root",
              "secretKey": "root@123"
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "Write",
            "List",
            "Tagging"
          ]
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: default
  labels:
    app: seaweedfs
spec:
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
    - name: grpc
      port: 18888
      targetPort: 18888
    - name: master-ui
      port: 19333
      targetPort: 19333
    - name: filer
      port: 8888
      targetPort: 8888
    - name: volume
      port: 12535
      targetPort: 12535
  selector:
    app: seaweedfs
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: default
spec:
  serviceName: "seaweedfs"
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          command: ["weed"]
          args:
            - "mini"
            - "-dir=/data"
            - "-s3"
            - "-master.raftHashicorp"
            - "-s3.config=/s3.json"
            - "-adminUser=root"
            - "-adminPassword=root@123"
          ports:
            - containerPort: 8333
              name: s3
            - containerPort: 8888
              name: filer
            - containerPort: 12535
              name: volume
          volumeMounts:
            - name: seaweed-data
              mountPath: /data
            - name: s3-config-volume
              mountPath: /s3.json
              subPath: s3.json
      volumes:
        - name: s3-config-volume
          configMap:
            name: seaweedfs-s3-config
  volumeClaimTemplates:
    - metadata:
        name: seaweed-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
